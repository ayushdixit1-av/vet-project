<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer - VetCrack</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .pdf-chat-toggle {
      background: linear-gradient(135deg, #00ff88, #00ccff);
      border: none;
      color: #0a0a1a;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: opacity 0.2s;
      margin-left: 8px;
    }
    .pdf-chat-toggle:hover { opacity: 0.85; }
    .pdf-chat-toggle.active { opacity: 0.6; }

    .pdf-chat-sidebar {
      position: fixed;
      top: 0;
      right: -400px;
      width: 380px;
      height: 100vh;
      background: #0d0d24;
      border-left: 1px solid rgba(0,255,136,0.15);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease;
      box-shadow: -4px 0 30px rgba(0,0,0,0.5);
    }
    .pdf-chat-sidebar.open { right: 0; }

    .pdf-chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(135deg, rgba(0,255,136,0.12), rgba(0,204,255,0.08));
      border-bottom: 1px solid rgba(0,255,136,0.1);
      flex-shrink: 0;
    }
    .pdf-chat-header-left { display: flex; align-items: center; gap: 10px; }
    .pdf-chat-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00ff88, #00ccff);
      display: flex; align-items: center; justify-content: center;
      color: #0a0a1a;
      font-size: 14px;
    }
    .pdf-chat-name { font-weight: 600; font-size: 13px; color: #e0e0e0; }
    .pdf-chat-actions { display: flex; align-items: center; gap: 6px; }
    .pdf-chat-close {
      background: none; border: none; color: #888;
      font-size: 20px; cursor: pointer; line-height: 1; padding: 0 4px;
    }
    .pdf-chat-close:hover { color: #fff; }

    .pdf-chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(0,0,0,0.2);
    }
    .pdf-chat-messages::-webkit-scrollbar { width: 4px; }
    .pdf-chat-messages::-webkit-scrollbar-track { background: transparent; }
    .pdf-chat-messages::-webkit-scrollbar-thumb { background: rgba(0,255,136,0.3); border-radius: 4px; }

    .pdf-chat-msg {
      display: flex; flex-direction: column;
      max-width: 88%;
      animation: pcmFadeIn 0.25s ease;
    }
    @keyframes pcmFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .pdf-chat-msg-bot { align-self: flex-start; }
    .pdf-chat-msg-user { align-self: flex-end; }
    .pdf-chat-msg-content {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      color: #e0e0e0;
    }
    .pdf-chat-msg-bot .pdf-chat-msg-content {
      background: rgba(255,255,255,0.06);
      border-bottom-left-radius: 4px;
    }
    .pdf-chat-msg-user .pdf-chat-msg-content {
      background: linear-gradient(135deg, rgba(0,255,136,0.2), rgba(0,204,255,0.15));
      border-bottom-right-radius: 4px;
    }
    .pdf-chat-msg-content strong { color: #00ff88; }
    .pdf-chat-msg-content ul, .pdf-chat-msg-content ol { margin: 4px 0; padding-left: 18px; }

    .pdf-chat-input-area {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(0,0,0,0.25);
      flex-shrink: 0;
    }
    .pdf-chat-input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #e0e0e0;
      outline: none;
    }
    .pdf-chat-input:focus { border-color: rgba(0,255,136,0.4); }
    .pdf-chat-input::placeholder { color: #666; }
    .pdf-chat-send {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #00ff88, #00ccff);
      color: #0a0a1a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .pdf-chat-send:hover { opacity: 0.85; }
    .pdf-chat-send:disabled { opacity: 0.4; cursor: not-allowed; }

    .pdf-chat-typing .pdf-chat-msg-content::after {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      background: #888;
      border-radius: 50%;
      animation: pcmDotPulse 1.2s infinite;
    }
    @keyframes pcmDotPulse { 0%,20% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    .pdf-chat-typing .pdf-chat-msg-content { min-width: 48px; }

    @media (max-width: 640px) {
      .pdf-chat-sidebar { width: 100vw; right: -100vw; }
    }
  </style>
</head>
<body>
  <div class="pdf-viewer-container">
    <div class="pdf-toolbar glass">
      <div class="toolbar-left">
        <a href="javascript:history.back()" class="toolbar-btn"><i class="fas fa-arrow-left"></i></a>
        <span id="pdfViewerTitle" class="toolbar-title">Loading PDF...</span>
      </div>
      <div class="toolbar-right">
        <button id="pdfChatToggle" class="pdf-chat-toggle" title="Open VetBot AI"><i class="fas fa-robot"></i></button>
        <button id="fullscreenBtn" class="toolbar-btn"><i class="fas fa-expand"></i></button>
      </div>
    </div>
    <div class="pdf-viewport" id="pdfViewport">
      <div id="pdfRenderer" class="pdf-renderer"></div>
      <div id="watermarkOverlay" class="watermark-overlay"></div>
    </div>
    <div class="pdf-loading" id="pdfLoading">
      <i class="fas fa-spinner fa-spin fa-3x"></i>
      <p>Loading your secure document...</p>
    </div>
  </div>

  <!-- VetBot Sidebar Chat -->
  <div class="pdf-chat-sidebar" id="pdfChatSidebar">
    <div class="pdf-chat-header">
      <div class="pdf-chat-header-left">
        <div class="pdf-chat-avatar"><i class="fas fa-robot" style="font-size:16px;"></i></div>
        <div>
          <div class="pdf-chat-name">VetBot AI</div>
          <div style="font-size:10px;color:#666;" id="pdfChatStatus">Online</div>
        </div>
      </div>
      <div class="pdf-chat-actions">
        <button id="pdfChatLang" class="vetbot-lang-btn" title="Switch to Hinglish" style="font-size:9px;padding:2px 7px;">EN</button>
        <button class="pdf-chat-close" id="pdfChatClose">&times;</button>
      </div>
    </div>
    <div class="pdf-chat-messages" id="pdfChatMessages">
      <div class="pdf-chat-msg pdf-chat-msg-bot">
        <div class="pdf-chat-msg-content">Hi! I'm VetBot. Ask me anything about this topic or any veterinary question while you study!</div>
      </div>
    </div>
    <div class="pdf-chat-input-area">
      <input type="text" class="pdf-chat-input" id="pdfChatInput" placeholder="Ask about this PDF topic..." autocomplete="off">
      <button class="pdf-chat-send" id="pdfChatSend"><i class="fas fa-paper-plane" style="font-size:13px;"></i></button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    (function() {
      const sidebar = document.getElementById('pdfChatSidebar');
      const toggle = document.getElementById('pdfChatToggle');
      const close = document.getElementById('pdfChatClose');
      const messagesEl = document.getElementById('pdfChatMessages');
      const inputEl = document.getElementById('pdfChatInput');
      const sendBtn = document.getElementById('pdfChatSend');
      const statusEl = document.getElementById('pdfChatStatus');
      const langBtn = document.getElementById('pdfChatLang');
      let useHinglish = false;
      let currentTitle = '';

      const user = getCurrentUser();

      langBtn.addEventListener('click', function() {
        useHinglish = !useHinglish;
        this.textContent = useHinglish ? 'HI' : 'EN';
        this.classList.toggle('hinglish', useHinglish);
        addMsg('Language switched to **' + (useHinglish ? 'Hinglish' : 'English') + '**', false);
      });

      function getPdfTitle() {
        const params = new URLSearchParams(window.location.search);
        return decodeURIComponent(params.get('title') || 'PDF Document');
      }

      function openChat() {
        sidebar.classList.add('open');
        toggle.classList.add('active');
        currentTitle = getPdfTitle();
        inputEl.focus();
        checkCredits();
      }

      function closeChat() {
        sidebar.classList.remove('open');
        toggle.classList.remove('active');
      }

      toggle.addEventListener('click', function() {
        if (sidebar.classList.contains('open')) {
          closeChat();
        } else {
          openChat();
        }
      });

      // Auto-open when PDF loads
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(openChat, 800);
      });

      close.addEventListener('click', closeChat);

      function getAuthHeaders() {
        const token = localStorage.getItem('vetcrack_token');
        const h = { 'Content-Type': 'application/json' };
        if (token) h['Authorization'] = 'Bearer ' + token;
        return h;
      }

      function checkCredits() {
        if (!getToken()) { statusEl.textContent = 'Login'; return; }
        fetch('/api/credits/my-credits', { headers: getAuthHeaders() })
          .then(r => r.json())
          .then(d => {
            statusEl.textContent = d.credits !== undefined ? d.credits + ' credits' : 'Online';
          })
          .catch(() => {});
      }

      function getToken() { return localStorage.getItem('vetcrack_token'); }

      function addMsg(text, isUser) {
        const div = document.createElement('div');
        div.className = 'pdf-chat-msg ' + (isUser ? 'pdf-chat-msg-user' : 'pdf-chat-msg-bot');
        const content = document.createElement('div');
        content.className = 'pdf-chat-msg-content';
        content.innerHTML = text;
        div.appendChild(content);
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function showTyping() {
        const div = document.createElement('div');
        div.className = 'pdf-chat-msg pdf-chat-msg-bot pdf-chat-typing';
        div.id = 'pdfChatTyping';
        const content = document.createElement('div');
        content.className = 'pdf-chat-msg-content';
        content.textContent = '';
        div.appendChild(content);
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function removeTyping() {
        const el = document.getElementById('pdfChatTyping');
        if (el) el.remove();
      }

      function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
      }

      function formatReply(text) {
        return escapeHtml(text)
          .replace(/### (.+)/g, '<strong>$1</strong>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\n/g, '<br>');
      }

      async function sendMsg() {
        const msg = inputEl.value.trim();
        if (!msg) return;
        if (!getToken()) { addMsg('**Please login** to chat.', false); return; }

        addMsg(escapeHtml(msg), true);
        inputEl.value = '';
        sendBtn.disabled = true;
        showTyping();

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({
              message: 'Regarding PDF: "' + currentTitle + '". ' + msg,
              language: useHinglish ? 'hinglish' : 'english'
            })
          });
          const data = await res.json();
          removeTyping();
          if (data.reply) {
            let r = formatReply(data.reply);
            if (data.images && data.images.length) {
              r += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">';
              data.images.forEach(img => {
                r += '<a href="' + escapeHtml(img.url) + '" target="_blank" rel="noopener"><img src="' + escapeHtml(img.url) + '" alt="' + escapeHtml(img.alt) + '" loading="lazy" style="width:100%;max-height:160px;object-fit:cover;border-radius:8px;border:1px solid rgba(255,255,255,0.06);"></a>';
              });
              r += '</div>';
            }
            if (data.creditsRemaining !== undefined) {
              r += '<br><br><span style="font-size:11px;color:#666;">Credits: ' + data.creditsRemaining + '</span>';
              statusEl.textContent = data.creditsRemaining + ' credits';
            }
            addMsg(r, false);
          } else if (data.error) {
            if (data.needsPurchase) {
              addMsg('**Out of credits!** <a href="/pages/credits.html" style="color:#00ff88;">Purchase credits</a> to continue.', false);
            } else {
              addMsg('**VetBot:** ' + escapeHtml(data.error), false);
            }
          }
        } catch (err) {
          removeTyping();
          addMsg('**VetBot:** Connection error.', false);
        } finally {
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }

      sendBtn.addEventListener('click', sendMsg);
      inputEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendMsg(); });
    })();
  </script>
  <script src="../js/pdf-viewer.js"></script>
</body>
</html>
