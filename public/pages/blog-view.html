<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - VetCrack</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .article-wrap {
      width: 100%;
      min-height: 100vh;
    }
    .article-header {
      padding: 140px 5% 60px;
      background: radial-gradient(ellipse at 50% 0%, rgba(0,255,136,0.04) 0%, transparent 70%);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .article-header .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-primary);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 32px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .article-header .back-link:hover { opacity: 0.75; }
    .article-meta {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .article-title {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 800;
      line-height: 1.15;
      margin: 0 0 16px;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .article-byline {
      font-size: 15px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .article-desc {
      font-size: 20px;
      color: var(--text-secondary);
      line-height: 1.7;
      max-width: 720px;
      margin-top: 8px;
    }
    .article-hero {
      width: 100%;
    }
    .article-hero img {
      width: 100%;
      display: block;
      max-height: 560px;
      object-fit: cover;
    }
    .article-body {
      padding: 60px 5% 100px;
      max-width: 960px;
      margin: 0 auto;
    }
    .article-body .content {
      font-size: 18px;
      line-height: 2;
      color: var(--text-primary);
    }
    .article-body .content :deep(p) {
      margin-bottom: 28px;
    }
    .article-body .content img {
      width: 100% !important;
      height: auto !important;
      border-radius: 14px;
      margin: 48px 0;
    }
    .article-tags {
      margin-top: 56px;
      padding-top: 36px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .article-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      gap: 20px;
    }
    .article-loading i {
      font-size: 36px;
      color: var(--accent-primary);
    }
    .article-loading p {
      color: var(--text-secondary);
      font-size: 15px;
    }
    .article-error {
      text-align: center;
      padding: 120px 20px;
    }
    .article-error p {
      color: var(--danger);
      font-size: 16px;
      margin-bottom: 16px;
    }
    .article-error a {
      color: var(--accent-primary);
    }
    @media (max-width: 768px) {
      .article-header { padding: 120px 20px 40px; }
      .article-body { padding: 40px 20px 80px; }
      .article-body .content { font-size: 16px; line-height: 1.85; }
      .article-desc { font-size: 17px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo"><i class="fas fa-paw"></i> VetCrack</a>
      <div class="nav-toggle" id="navToggle">
        <i class="fas fa-bars"></i>
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="../pages/login.html" id="loginLink">Login</a></li>
        <li><a href="../pages/register.html" id="registerLink">Register</a></li>
        <li><a href="../pages/admin-dashboard.html" id="adminLink" style="display:none;">Admin</a></li>
        <li><a href="../pages/user-dashboard.html" id="dashboardLink" style="display:none;">Dashboard</a></li>
        <li><a href="#" id="logoutBtn" style="display:none;">Logout</a></li>
      </ul>
    </div>
  </nav>

  <main id="blogViewContent" class="article-wrap">
    <div class="article-loading">
      <i class="fas fa-spinner fa-spin"></i>
      <p>Loading article...</p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 VetCrack. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (async () => {
      const container = document.getElementById('blogViewContent');
      try {
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const slug = pathSegments.length >= 2 && pathSegments[0] === 'blog' ? pathSegments[1] : null;
        const params = new URLSearchParams(window.location.search);
        const blogId = params.get('id');

        if (!blogId && !slug) {
          container.innerHTML = '<div class="article-error"><p>No blog specified.</p><a href="/">Go back home</a></div>';
          return;
        }

        const endpoint = slug ? '/blogs/slug/' + slug : '/blogs/' + blogId;
        const data = await apiRequest(endpoint);
        const blog = data.blog;
        if (!blog) throw new Error('Blog not found');

        document.title = (blog.meta_title || blog.title) + ' - VetCrack';
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.content = blog.meta_description || blog.description || '';

        const formattedDate = blog.created_at
          ? new Date(blog.created_at).toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' })
          : '';

        container.innerHTML = `
          <article class="article-wrap">
            <header class="article-header">
              <a href="/#blogs" class="back-link"><i class="fas fa-arrow-left"></i> Back to Blogs</a>
              <div class="article-meta">
                ${blog.category ? `<span class="blog-tag">${blog.category}</span>` : ''}
                <span class="article-byline"><i class="fas fa-user" style="font-size:13px;opacity:0.5;"></i> ${blog.author || 'VetCrack'}${formattedDate ? ' &middot; ' + formattedDate : ''}</span>
              </div>
              <h1 class="article-title">${blog.title}</h1>
              ${blog.description ? `<p class="article-desc">${blog.description}</p>` : ''}
            </header>
            ${blog.thumbnail ? `<div class="article-hero"><img src="${blog.thumbnail}" alt="${blog.title}"></div>` : ''}
            <div class="article-body">
              <div class="content">${blog.content || ''}</div>
              ${blog.tags ? `<div class="article-tags">${blog.tags.split(',').map(t => '<span class="blog-tag">' + t.trim() + '</span>').join('')}</div>` : ''}
            </div>
          </article>
        `;
      } catch (err) {
        container.innerHTML = '<div class="article-error"><p>Failed to load article: ' + err.message + '</p><a href="/">Go back home</a></div>';
      }
    })();
  </script>
</body>
</html>
