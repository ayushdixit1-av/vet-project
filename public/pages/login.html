<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VetCrack</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card glass">
      <div class="auth-header">
        <a href="/" class="auth-logo"><i class="fas fa-paw"></i> VetCrack</a>
        <h2>Welcome Back</h2>
        <p>Sign in to continue learning</p>
      </div>
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
          <i class="fas fa-eye toggle-password" id="togglePassword"></i>
        </div>
        <button type="submit" class="btn btn-primary btn-full glow" id="loginBtn">
          <span id="loginText">Sign In</span>
          <span id="loginLoader" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Signing in...</span>
        </button>
      </form>
      <div class="auth-divider"><span>OR</span></div>
      <button id="googleLoginBtn" class="btn btn-google btn-full">
        <i class="fab fa-google"></i> Continue with Google
      </button>
      <div id="authError" class="auth-error"></div>
      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Register</a></p>
        <a href="/">Back to Home</a>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
