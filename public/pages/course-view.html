<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course - VetCrack</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <nav class="navbar glass">
    <div class="nav-container">
      <a href="/" class="nav-logo"><i class="fas fa-paw"></i> <span>VetCrack</span></a>
      <div class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/">Courses</a></li>
        <li><a href="user-dashboard.html">Dashboard</a></li>
        <li><a href="#" id="cvLogoutBtn">Logout</a></li>
      </ul>
    </div>
  </nav>

  <div class="course-view-container">
    <div class="container">
      <div class="course-view-header glass">
        <div class="course-view-info">
          <h1 id="courseViewTitle">Loading...</h1>
          <p id="courseViewDesc" class="text-muted"></p>
          <div class="course-meta">
            <span><i class="fas fa-layer-group"></i> <span id="courseSectionCount">0</span> Sections</span>
            <span><i class="fas fa-signal"></i> <span id="courseDifficulty">Beginner</span></span>
            <span><i class="fas fa-tag"></i> <span id="courseCategory">General</span></span>
          </div>
        </div>
        <div class="course-view-action">
          <div id="purchaseSection">
            <div class="price-tag" id="coursePriceDisplay">₹0</div>
            <button id="buyNowBtn" class="btn btn-primary glow btn-large"><i class="fas fa-shopping-cart"></i> Buy Now</button>
          </div>
          <div id="ownedSection" style="display:none;">
            <span class="badge badge-success"><i class="fas fa-check"></i> Purchased</span>
            <button id="continueLearningBtn" class="btn btn-primary glow"><i class="fas fa-play"></i> Continue Learning</button>
          </div>
        </div>
      </div>

      <div class="course-sections" id="courseSections">
        <h3>Course Content</h3>
        <div id="sectionsList"><div class="loader"><i class="fas fa-spinner fa-spin"></i> Loading sections...</div></div>
      </div>

      <div class="course-tests" id="courseTests" style="margin-top:32px;">
        <h3>Tests</h3>
        <div id="testsList"><p class="text-muted">Loading tests...</p></div>
      </div>
    </div>
  </div>

  <div id="testModal" class="modal-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;overflow-y:auto;padding:20px;" onclick="if(event.target===this)closeTestModal()">
    <div class="modal-content glass" style="max-width:700px;margin:20px auto;padding:32px;border-radius:16px;position:relative;">
      <button onclick="closeTestModal()" style="position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-secondary);font-size:24px;cursor:pointer;"><i class="fas fa-times"></i></button>
      <div id="testModalBody"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/course-view.js"></script>
</body>
</html>
