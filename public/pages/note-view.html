<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note - VetCrack</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .breadcrumb-wrap {
      max-width: 900px; margin: 0 auto; padding: 100px 20px 0;
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; color: var(--text-secondary);
    }
    .breadcrumb-wrap a { color: var(--accent-primary); text-decoration: none; }
    .breadcrumb-wrap a:hover { text-decoration: underline; }
    .breadcrumb-wrap i { font-size: 10px; }
    .note-view-container {
      max-width: 900px; margin: 0 auto; padding: 30px 20px 80px;
    }
    .note-header {
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .note-header h1 {
      font-size: clamp(26px, 3.5vw, 36px);
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .note-header .note-meta {
      display: flex; gap: 20px; flex-wrap: wrap;
      font-size: 13px; color: var(--text-secondary);
    }
    .note-header .note-meta span { display: flex; align-items: center; gap: 6px; }
    .note-header .note-meta i { color: var(--accent-primary); font-size: 12px; }
    .note-content {
      font-size: 16px; line-height: 1.8;
      color: rgba(255,255,255,0.85);
    }
    .note-content h1, .note-content h2, .note-content h3 {
      margin-top: 32px; margin-bottom: 12px;
      color: var(--text-primary);
    }
    .note-content h2 { font-size: 24px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 8px; }
    .note-content h3 { font-size: 20px; }
    .note-content p { margin-bottom: 16px; }
    .note-content ul, .note-content ol { margin-bottom: 16px; padding-left: 24px; }
    .note-content li { margin-bottom: 6px; }
    .note-content table {
      width: 100%; border-collapse: collapse; margin: 20px 0;
      font-size: 14px;
    }
    .note-content th, .note-content td {
      padding: 10px 14px; border: 1px solid rgba(255,255,255,0.08);
      text-align: left;
    }
    .note-content th { background: rgba(0,255,136,0.05); color: var(--accent-primary); font-weight: 600; }
    .note-content td { color: rgba(255,255,255,0.7); }
    .note-content code {
      background: rgba(255,255,255,0.05); padding: 2px 6px;
      border-radius: 4px; font-size: 14px;
    }
    .note-content pre {
      background: rgba(0,0,0,0.3); padding: 16px; border-radius: 8px;
      overflow-x: auto; margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .note-content pre code { background: none; padding: 0; }
    .note-content blockquote {
      border-left: 3px solid var(--accent-primary);
      padding: 12px 20px; margin: 20px 0;
      background: rgba(0,255,136,0.03);
      color: var(--text-secondary);
      border-radius: 0 8px 8px 0;
    }
    .note-content img {
      max-width: 100%; border-radius: 8px;
      margin: 20px 0;
    }
    .note-content a { color: var(--accent-primary); }
    .note-content hr { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 32px 0; }
    .loader { text-align: center; padding: 80px 0; color: var(--text-secondary); }
    .note-actions {
      margin-top: 40px; padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex; gap: 12px; flex-wrap: wrap;
    }
    .note-actions a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: var(--text-secondary); text-decoration: none;
      font-size: 14px; transition: all 0.25s;
    }
    .note-actions a:hover { background: rgba(0,255,136,0.06); border-color: var(--accent-primary); color: var(--accent-primary); }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo"><i class="fas fa-paw"></i> VetCrack</a>
      <div class="nav-toggle" id="navToggle">
        <i class="fas fa-bars"></i>
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/notes">Free Notes</a></li>
        <li><a href="/medicines">Medicines</a></li>
        <li><a href="/pages/login.html">Login</a></li>
      </ul>
    </div>
  </nav>

  <div class="breadcrumb-wrap" id="breadcrumbWrap">
    <a href="/"><i class="fas fa-home"></i></a>
    <i class="fas fa-chevron-right"></i>
    <a href="/notes">Free Notes</a>
    <i class="fas fa-chevron-right"></i>
    <span id="breadcrumbCat">Loading...</span>
  </div>

  <div class="note-view-container" id="noteContainer">
    <div class="loader"><i class="fas fa-spinner fa-spin"></i> Loading note...</div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 VetCrack. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const catSlug = pathParts[1];
    const pageSlug = pathParts[2];

    async function loadNote() {
      const container = document.getElementById('noteContainer');
      try {
        const res = await fetch(`/api/note-pages/${catSlug}/${pageSlug}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        const page = data.page;

        document.title = `${page.title} - VetCrack Notes`;

        const bcCat = document.getElementById('breadcrumbCat');
        bcCat.innerHTML = `<a href="/notes/${catSlug}" style="color:var(--accent-primary);text-decoration:none;">${page.category_name || catSlug}</a>`;
        const bcSep = document.createElement('i');
        bcSep.className = 'fas fa-chevron-right';
        bcCat.parentNode.insertBefore(bcSep, bcCat.nextSibling);
        const bcPage = document.createElement('span');
        bcPage.textContent = page.title;
        bcCat.parentNode.insertBefore(bcPage, bcCat.nextSibling.nextSibling);

        container.innerHTML = `
          <div class="note-header">
            <h1>${page.title}</h1>
            <div class="note-meta">
              <span><i class="fas fa-folder"></i> ${page.category_name || 'Uncategorized'}</span>
              ${page.subcategory_name ? `<span><i class="fas fa-folder-open"></i> ${page.subcategory_name}</span>` : ''}
              <span><i class="fas fa-eye"></i> ${page.view_count || 0} views</span>
            </div>
          </div>
          <div class="note-content">${page.html_content || page.content || '<p>No content available.</p>'}</div>
          <div class="note-actions">
            <a href="/notes/${catSlug}"><i class="fas fa-arrow-left"></i> Back to ${page.category_name || 'Category'}</a>
            <a href="/notes"><i class="fas fa-th-large"></i> All Notes</a>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="loader" style="color:#ef4444;"><i class="fas fa-exclamation-triangle"></i> Failed to load note: ${err.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadNote);
  </script>
</body>
</html>
