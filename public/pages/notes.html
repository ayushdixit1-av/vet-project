<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Veterinary Notes - VetCrack</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .notes-hero {
      padding: 120px 20px 60px;
      text-align: center;
      background: radial-gradient(ellipse at 50% 0%, rgba(0,255,136,0.05) 0%, transparent 70%);
      position: relative;
    }
    .notes-hero h1 { font-size: clamp(28px, 4vw, 42px); margin-bottom: 12px; }
    .notes-hero p { color: var(--text-secondary); font-size: 16px; margin-bottom: 8px; }
    .notes-grid {
      max-width: 1200px; margin: 0 auto; padding: 20px 20px 60px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .note-cat-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px; padding: 28px;
      transition: all 0.3s; cursor: pointer;
      position: relative; overflow: hidden;
    }
    .note-cat-card:hover {
      border-color: var(--accent-primary);
      background: rgba(0,255,136,0.03);
      transform: translateY(-2px);
    }
    .note-cat-card .cat-icon {
      width: 48px; height: 48px; border-radius: 12px;
      background: rgba(0,255,136,0.08);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: var(--accent-primary);
      margin-bottom: 16px;
    }
    .note-cat-card h3 { font-size: 18px; margin-bottom: 8px; }
    .note-cat-card p { font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.5; }
    .note-cat-card .cat-stats { display: flex; gap: 16px; font-size: 13px; color: var(--text-secondary); }
    .note-cat-card .cat-stats span { display: flex; align-items: center; gap: 6px; }
    .note-cat-card .cat-stats i { color: var(--accent-primary); font-size: 12px; }
    .note-cat-card .cat-arrow {
      position: absolute; top: 28px; right: 24px;
      color: rgba(255,255,255,0.1); font-size: 20px;
      transition: all 0.3s;
    }
    .note-cat-card:hover .cat-arrow { color: var(--accent-primary); transform: translateX(4px); }
    .loader { text-align: center; padding: 60px 0; color: var(--text-secondary); }
    .breadcrumb-wrap {
      max-width: 1200px; margin: 0 auto; padding: 100px 20px 0;
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; color: var(--text-secondary);
    }
    .breadcrumb-wrap a { color: var(--accent-primary); text-decoration: none; }
    .breadcrumb-wrap a:hover { text-decoration: underline; }
    .breadcrumb-wrap i { font-size: 10px; }
    @media (max-width: 640px) {
      .notes-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo"><i class="fas fa-paw"></i> VetCrack</a>
      <div class="nav-toggle" id="navToggle">
        <i class="fas fa-bars"></i>
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/notes">Free Notes</a></li>
        <li><a href="/medicines">Medicines</a></li>
        <li><a href="/pages/login.html">Login</a></li>
      </ul>
    </div>
  </nav>

  <div class="breadcrumb-wrap">
    <a href="/"><i class="fas fa-home"></i></a>
    <i class="fas fa-chevron-right"></i>
    <span>Free Notes</span>
  </div>

  <section class="notes-hero">
    <h1><i class="fas fa-book-open" style="color:var(--accent-primary);margin-right:12px;"></i> Free <span class="gradient-text">Veterinary Notes</span></h1>
    <p>Comprehensive study notes covering all aspects of veterinary science</p>
  </section>

  <div class="notes-grid" id="notesGrid">
    <div class="loader"><i class="fas fa-spinner fa-spin"></i> Loading notes...</div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 VetCrack. All rights reserved.</p>
    </div>
  </footer>

  <script>
    let allCategories = [];

    async function loadCategories() {
      const grid = document.getElementById('notesGrid');
      try {
        const res = await fetch('/api/note-categories?status=active');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        allCategories = data.categories || [];
        renderCategories();
      } catch (err) {
        grid.innerHTML = `<div class="loader" style="color:#ef4444;"><i class="fas fa-exclamation-triangle"></i> Failed to load: ${err.message}</div>`;
      }
    }

    function renderCategories() {
      const grid = document.getElementById('notesGrid');
      if (!allCategories.length) {
        grid.innerHTML = '<div class="loader"><i class="fas fa-folder-open"></i><p style="margin-top:8px;">No note categories available yet</p></div>';
        return;
      }
      const iconMap = {
        'file-text': 'fa-file-alt', 'book': 'fa-book', 'heart': 'fa-heartbeat',
        'brain': 'fa-brain', 'bone': 'fa-bone', 'microscope': 'fa-microscope',
        'pills': 'fa-pills', 'syringe': 'fa-syringe', 'tooth': 'fa-tooth',
        'eye': 'fa-eye', 'ear': 'fa-ear', 'lung': 'fa-lungs',
        'dna': 'fa-dna', 'flask': 'fa-flask'
      };

      grid.innerHTML = allCategories.map(cat => {
        const iconClass = iconMap[cat.icon] || 'fa-file-alt';
        return `
          <a href="/notes/${cat.slug}" class="note-cat-card" style="text-decoration:none;color:inherit;">
            <span class="cat-arrow"><i class="fas fa-arrow-right"></i></span>
            <div class="cat-icon"><i class="fas ${iconClass}"></i></div>
            <h3>${cat.name}</h3>
            <p>${cat.description || 'Veterinary study notes and resources'}</p>
            <div class="cat-stats">
              <span><i class="fas fa-folder"></i> ${cat.subcategory_count || 0} topics</span>
              <span><i class="fas fa-file"></i> ${cat.page_count || 0} pages</span>
            </div>
          </a>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', loadCategories);
  </script>
</body>
</html>
