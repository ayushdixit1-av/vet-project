<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy Credits - VetCrack AI</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --bg: #0a0a1a; --card: #0d0d24; --border: rgba(0,255,136,0.1); --green: #00ff88; --cyan: #00ccff; --text: #e0e0e0; --text-secondary: #888; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    .header { text-align: center; margin-bottom: 40px; }
    .header h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .header h1 span { background: linear-gradient(135deg, var(--green), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { color: var(--text-secondary); font-size: 16px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); text-decoration: none; margin-bottom: 24px; font-size: 14px; }
    .back-link:hover { color: var(--green); }
    .balance-card {
      background: linear-gradient(135deg, rgba(0,255,136,0.08), rgba(0,204,255,0.05));
      border: 1px solid rgba(0,255,136,0.15);
      border-radius: 16px;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .balance-label { color: var(--text-secondary); font-size: 14px; }
    .balance-amount { font-size: 36px; font-weight: 700; background: linear-gradient(135deg, var(--green), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .packages-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .package-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
    }
    .package-card:hover { border-color: rgba(0,255,136,0.3); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,255,136,0.06); }
    .package-card.popular { border-color: rgba(0,255,136,0.3); }
    .package-card.popular::before {
      content: 'Popular';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, var(--green), var(--cyan));
      color: #0a0a1a;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 14px;
      border-radius: 20px;
    }
    .package-card.selected { border-color: var(--green); box-shadow: 0 0 20px rgba(0,255,136,0.15); }
    .package-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .package-credits { font-size: 36px; font-weight: 700; margin: 8px 0; background: linear-gradient(135deg, var(--green), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .package-credits-label { font-size: 12px; color: var(--text-secondary); }
    .package-price { font-size: 22px; font-weight: 600; margin: 8px 0; }
    .package-price small { font-size: 14px; color: var(--text-secondary); }
    .package-desc { font-size: 13px; color: var(--text-secondary); margin: 8px 0; }
    .btn-purchase {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--green), var(--cyan));
      color: #0a0a1a;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    .btn-purchase:hover { opacity: 0.9; }
    .btn-purchase:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-checkout {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--green), var(--cyan));
      color: #0a0a1a;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-checkout:hover { opacity: 0.9; }
    .btn-checkout:disabled { opacity: 0.4; cursor: not-allowed; }
    .transaction-history { margin-top: 40px; }
    .transaction-history h3 { margin-bottom: 16px; font-size: 18px; }
    .txn-table { width: 100%; border-collapse: collapse; }
    .txn-table th, .txn-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
    .txn-table th { color: var(--text-secondary); font-weight: 600; }
    .txn-type { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .txn-type.grant, .txn-type.purchase { background: rgba(0,255,136,0.12); color: var(--green); }
    .txn-type.usage { background: rgba(255,107,107,0.12); color: #ff6b6b; }
    .txn-type.admin { background: rgba(0,204,255,0.12); color: var(--cyan); }
    .no-txns { color: var(--text-secondary); text-align: center; padding: 24px; font-size: 14px; }
    #loadingState, #errorState { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
    #loadingState i { font-size: 32px; margin-bottom: 12px; color: var(--green); }
    @media (max-width: 640px) { .packages-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>

    <div class="header">
      <h1><span>AI Credits</span></h1>
      <p>Purchase credits to use the VetBot AI assistant</p>
    </div>

    <div id="loadingState">
      <i class="fas fa-spinner fa-spin"></i>
      <p>Loading...</p>
    </div>
    <div id="errorState" style="display:none;">
      <i class="fas fa-exclamation-triangle" style="color:#ff6b6b;"></i>
      <p id="errorMsg">Failed to load. Please try again.</p>
      <button onclick="location.reload()" class="btn-purchase" style="max-width:200px;margin:16px auto;">Retry</button>
    </div>

    <div id="mainContent" style="display:none;">
      <div class="balance-card" id="balanceCard">
        <div>
          <div class="balance-label">Your Credits</div>
          <div class="balance-amount" id="creditBalance">0</div>
        </div>
        <div style="text-align:right;">
          <div class="balance-label">2 Credits = 1 Chat Message</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">Free credits given on signup</div>
        </div>
      </div>

      <h3 style="margin-bottom:16px;">Choose a Package</h3>
      <div class="packages-grid" id="packagesGrid"></div>

      <button class="btn-checkout" id="checkoutBtn" disabled>
        <span id="checkoutText">Select a package to continue</span>
        <span id="checkoutLoader" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Processing...</span>
      </button>

      <div class="transaction-history">
        <h3>Transaction History</h3>
        <div id="txnContainer"></div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      let selectedPackage = null;
      let packages = [];

      function getToken() { return localStorage.getItem('vetcrack_token'); }
      function getAuthHeaders() {
        const t = getToken();
        return { 'Content-Type': 'application/json', ...(t ? { 'Authorization': 'Bearer ' + t } : {}) };
      }

      async function loadData() {
        if (!getToken()) {
          document.getElementById('loadingState').style.display = 'none';
          document.getElementById('errorState').style.display = 'block';
          document.getElementById('errorMsg').textContent = 'Please login first.';
          return;
        }

        try {
          const [pkgRes, creditRes] = await Promise.all([
            fetch('/api/credits/packages', { headers: getAuthHeaders() }),
            fetch('/api/credits/my-credits', { headers: getAuthHeaders() })
          ]);

          const pkgData = await pkgRes.json();
          const creditData = await creditRes.json();

          packages = pkgData.packages || [];

          document.getElementById('loadingState').style.display = 'none';
          document.getElementById('mainContent').style.display = 'block';

          document.getElementById('creditBalance').textContent = creditData.credits || 0;

          renderPackages();
          renderTransactions(creditData.transactions || []);
        } catch (err) {
          document.getElementById('loadingState').style.display = 'none';
          document.getElementById('errorState').style.display = 'block';
          document.getElementById('errorMsg').textContent = err.message;
        }
      }

      function renderPackages() {
        const grid = document.getElementById('packagesGrid');
        grid.innerHTML = '';

        if (!packages.length) {
          grid.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:24px;">No packages available.</p>';
          return;
        }

        packages.forEach(pkg => {
          const card = document.createElement('div');
          card.className = 'package-card' + (pkg.popular ? ' popular' : '');
          card.dataset.id = pkg.id;

          card.innerHTML = `
            <div class="package-name">${escapeHtml(pkg.name)}</div>
            <div class="package-credits">${pkg.credits}</div>
            <div class="package-credits-label">Credits</div>
            <div class="package-price">₹${parseFloat(pkg.price).toFixed(0)}</div>
            <div class="package-desc">${escapeHtml(pkg.description || '')}</div>
          `;

          card.addEventListener('click', () => selectPackage(pkg));
          grid.appendChild(card);
        });
      }

      function selectPackage(pkg) {
        selectedPackage = pkg;
        document.querySelectorAll('.package-card').forEach(c => c.classList.remove('selected'));
        document.querySelector(`.package-card[data-id="${pkg.id}"]`).classList.add('selected');
        const btn = document.getElementById('checkoutBtn');
        btn.disabled = false;
        document.getElementById('checkoutText').textContent = 'Buy ' + pkg.name + ' — ₹' + parseFloat(pkg.price).toFixed(0);
      }

      document.getElementById('checkoutBtn').addEventListener('click', async function() {
        if (!selectedPackage) return;

        const btn = this;
        const text = document.getElementById('checkoutText');
        const loader = document.getElementById('checkoutLoader');
        btn.disabled = true;
        text.style.display = 'none';
        loader.style.display = 'inline';

        try {
          const orderRes = await fetch('/api/credits/create-order', {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({ packageId: selectedPackage.id })
          });
          const orderData = await orderRes.json();

          if (!orderRes.ok) throw new Error(orderData.error || 'Failed to create order');

          const options = {
            key: orderData.keyId,
            amount: orderData.amount,
            currency: orderData.currency,
            name: 'VetCrack',
            description: selectedPackage.name + ' (' + selectedPackage.credits + ' credits)',
            order_id: orderData.orderId,
            handler: async function(response) {
              try {
                const verifyRes = await fetch('/api/credits/verify', {
                  method: 'POST',
                  headers: getAuthHeaders(),
                  body: JSON.stringify({
                    orderId: response.razorpay_order_id,
                    paymentId: response.razorpay_payment_id,
                    signature: response.razorpay_signature,
                    packageId: selectedPackage.id
                  })
                });
                const verifyData = await verifyRes.json();

                if (verifyData.success) {
                  document.getElementById('creditBalance').textContent = verifyData.balance;
                  document.getElementById('checkoutText').textContent = '✅ ' + verifyData.message;
                  loadData();
                } else {
                  throw new Error(verifyData.error || 'Verification failed');
                }
              } catch (err) {
                alert('Payment verification failed: ' + err.message);
                text.style.display = 'inline';
                loader.style.display = 'none';
                btn.disabled = false;
              }
            },
            modal: {
              ondismiss: function() {
                text.style.display = 'inline';
                loader.style.display = 'none';
                btn.disabled = false;
              }
            },
            prefill: { name: '', email: '' },
            theme: { color: '#00ff88' }
          };

          const rzp = new Razorpay(options);
          rzp.open();
        } catch (err) {
          alert('Error: ' + err.message);
          text.style.display = 'inline';
          loader.style.display = 'none';
          btn.disabled = false;
        }
      });

      function renderTransactions(txns) {
        const container = document.getElementById('txnContainer');

        if (!txns || !txns.length) {
          container.innerHTML = '<div class="no-txns">No transactions yet. Buy credits to get started!</div>';
          return;
        }

        let html = '<table class="txn-table"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Description</th></tr></thead><tbody>';
        txns.forEach(t => {
          const isPositive = parseFloat(t.credits) > 0;
          const typeClass = t.type === 'purchase' || t.type === 'grant' ? 'grant' : (t.type === 'usage' ? 'usage' : 'admin');
          const typeLabel = t.type.charAt(0).toUpperCase() + t.type.slice(1);
          const sign = isPositive ? '+' : '';
          const date = new Date(t.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

          html += `<tr>
            <td>${date}</td>
            <td><span class="txn-type ${typeClass}">${typeLabel}</span></td>
            <td style="color:${isPositive ? 'var(--green)' : '#ff6b6b'}">${sign}${t.credits}</td>
            <td>${escapeHtml(t.description || '')}</td>
          </tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
      }

      function escapeHtml(text) {
        if (!text) return '';
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
      }

      loadData();
    })();
  </script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</body>
</html>
