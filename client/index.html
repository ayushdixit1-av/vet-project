  <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- VetBot AI Course Assistant -->
    <div id="vetbot-widget">
      <button id="vetbot-toggle" aria-label="Open AI Assistant">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <div id="vetbot-panel">
        <div id="vetbot-header">
          <div id="vetbot-header-info">
            <div id="vetbot-avatar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <div>
              <div id="vetbot-name">VetBot AI</div>
              <div id="vetbot-status">Online</div>
            </div>
          </div>
          <button id="vetbot-close" aria-label="Close chat">&times;</button>
        </div>
        <div id="vetbot-messages">
          <div class="vetbot-msg vetbot-msg-bot">
            <div class="vetbot-msg-content">Hi! I'm VetBot, your AI course assistant. Ask me about veterinary topics, courses, or anything on VetCrack!</div>
          </div>
        </div>
        <div id="vetbot-input-area">
          <input type="text" id="vetbot-input" placeholder="Ask me anything..." autocomplete="off">
          <button id="vetbot-send" aria-label="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>

    <style>
      #vetbot-widget {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 99999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #vetbot-toggle {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(135deg, #00ff88, #00ccff);
        color: #0a0a1a;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 20px rgba(0,255,136,0.4);
        transition: transform 0.2s, box-shadow 0.2s;
      }
      #vetbot-toggle:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 28px rgba(0,255,136,0.6);
      }
      #vetbot-widget.open #vetbot-toggle svg { transform: rotate(45deg); }
      #vetbot-panel {
        display: none;
        position: absolute;
        bottom: 68px;
        right: 0;
        width: 360px;
        max-width: calc(100vw - 48px);
        height: 520px;
        max-height: calc(100vh - 120px);
        background: #0d0d24;
        border: 1px solid rgba(0,255,136,0.15);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        flex-direction: column;
      }
      #vetbot-widget.open #vetbot-panel { display: flex; }
      #vetbot-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        background: linear-gradient(135deg, rgba(0,255,136,0.12), rgba(0,204,255,0.08));
        border-bottom: 1px solid rgba(0,255,136,0.1);
      }
      #vetbot-header-info { display: flex; align-items: center; gap: 10px; }
      #vetbot-avatar {
        width: 34px; height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, #00ff88, #00ccff);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #0a0a1a;
      }
      #vetbot-name { font-weight: 600; font-size: 14px; color: #e0e0e0; }
      #vetbot-status { font-size: 11px; color: #00ff88; }
      #vetbot-close { background: none; border: none; color: #888; font-size: 22px; cursor: pointer; line-height: 1; padding: 0 4px; }
      #vetbot-close:hover { color: #fff; }
      #vetbot-messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: rgba(0,0,0,0.2);
      }
      #vetbot-messages::-webkit-scrollbar { width: 4px; }
      #vetbot-messages::-webkit-scrollbar-thumb { background: rgba(0,255,136,0.3); border-radius: 4px; }
      .vetbot-msg {
        display: flex;
        flex-direction: column;
        max-width: 85%;
        animation: vetbotFadeIn 0.25s ease;
      }
      @keyframes vetbotFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .vetbot-msg-bot { align-self: flex-start; }
      .vetbot-msg-user { align-self: flex-end; }
      .vetbot-msg-content {
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 13.5px;
        line-height: 1.5;
        color: #e0e0e0;
      }
      .vetbot-msg-bot .vetbot-msg-content { background: rgba(255,255,255,0.06); border-bottom-left-radius: 4px; }
      .vetbot-msg-user .vetbot-msg-content { background: linear-gradient(135deg, rgba(0,255,136,0.2), rgba(0,204,255,0.15)); border-bottom-right-radius: 4px; }
      #vetbot-input-area {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-top: 1px solid rgba(255,255,255,0.06);
        background: rgba(0,0,0,0.25);
      }
      #vetbot-input {
        flex: 1;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        color: #e0e0e0;
        outline: none;
      }
      #vetbot-input:focus { border-color: rgba(0,255,136,0.4); }
      #vetbot-send {
        width: 38px; height: 38px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(135deg, #00ff88, #00ccff);
        color: #0a0a1a;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      #vetbot-send:hover { opacity: 0.85; }
      #vetbot-send:disabled { opacity: 0.4; cursor: not-allowed; }
      .vetbot-typing .vetbot-msg-content::after {
        content: '';
        display: inline-block;
        width: 6px; height: 6px;
        background: #888;
        border-radius: 50%;
        animation: vetbotDotPulse 1.2s infinite;
      }
      @keyframes vetbotDotPulse { 0%,20% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
      .vetbot-typing .vetbot-msg-content { min-width: 48px; }
    </style>

    <script>
      (function() {
        const toggle = document.getElementById('vetbot-toggle');
        const panel = document.getElementById('vetbot-panel');
        const closeBtn = document.getElementById('vetbot-close');
        const widget = document.getElementById('vetbot-widget');
        const messagesEl = document.getElementById('vetbot-messages');
        const inputEl = document.getElementById('vetbot-input');
        const sendBtn = document.getElementById('vetbot-send');

        function togglePanel() {
          widget.classList.toggle('open');
          if (widget.classList.contains('open')) {
            inputEl.focus();
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        }

        toggle.addEventListener('click', togglePanel);
        closeBtn.addEventListener('click', togglePanel);

        function addMessage(text, isUser) {
          const div = document.createElement('div');
          div.className = 'vetbot-msg ' + (isUser ? 'vetbot-msg-user' : 'vetbot-msg-bot');
          const content = document.createElement('div');
          content.className = 'vetbot-msg-content';
          content.innerHTML = text;
          div.appendChild(content);
          messagesEl.appendChild(div);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function showTyping() {
          const div = document.createElement('div');
          div.className = 'vetbot-msg vetbot-msg-bot vetbot-typing';
          div.id = 'vetbot-typing';
          const content = document.createElement('div');
          content.className = 'vetbot-msg-content';
          content.textContent = '';
          div.appendChild(content);
          messagesEl.appendChild(div);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function removeTyping() {
          const el = document.getElementById('vetbot-typing');
          if (el) el.remove();
        }

        async function sendMessage() {
          const msg = inputEl.value.trim();
          if (!msg) return;

          addMessage(escapeHtml(msg), true);
          inputEl.value = '';
          sendBtn.disabled = true;
          showTyping();

          try {
            const res = await fetch('/api/chat', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: msg })
            });
            const data = await res.json();
            removeTyping();
            if (data.reply) addMessage(formatReply(data.reply), false);
            else if (data.error) addMessage('**VetBot:** ' + escapeHtml(data.error), false);
          } catch (err) {
            removeTyping();
            addMessage('**VetBot:** Sorry, I could not connect. Please check your internet and try again.', false);
          } finally {
            sendBtn.disabled = false;
            inputEl.focus();
          }
        }

        function escapeHtml(text) {
          const d = document.createElement('div');
          d.textContent = text;
          return d.innerHTML;
        }

        function formatReply(text) {
          return escapeHtml(text)
            .replace(/### (.+)/g, '<strong>$1</strong>')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br>');
        }

        sendBtn.addEventListener('click', sendMessage);
        inputEl.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') sendMessage();
        });
      })();
    </script>
  </body>
</html>
